<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://turing.captcha.qcloud.com https://www.tycaptcha.com https://rce.tencentrio.com; img-src 'self' data: https://*.captcha.gtimg.com https://*.qcloud.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://turing.captcha.qcloud.com https://turing.captcha.gtimg.com https://global.turing.captcha.gtimg.com https://cloudcache.tencentcs.com; frame-src https://turing.captcha.qcloud.com https://ca.turing.captcha.qcloud.com https://www.tycaptcha.com; base-uri 'none'; form-action 'self'" />
<title>2xapi Codex Console</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <span class="brand">2xapi Console</span>
    <span class="spacer"></span>
    <span class="chip" id="gwChip"><span class="led"></span>gateway 127.0.0.1:8787</span>
    <span class="chip"><b id="hostChip">未托管</b></span>
    <span class="spacer" style="flex:0 0 8px"></span>
    <span id="topAuth"></span>
  </header>

  <div class="frame" id="frame">
    <!-- ① agent 图标导航(骨架:现在 Codex,未来 Claude/更多) -->
    <nav class="nav">
      <div class="logo"><img src="brand-logo.svg" alt="2xapi" style="width:100%;height:100%;border-radius:10px;object-fit:cover"></div>
      <button class="nav-btn agent on" style="--ac:var(--c-gw)" data-a="agent" data-g="codex" title="Codex">
        <svg fill="#E8ECF4" fill-rule="evenodd" height="19" viewBox="0 0 24 24" width="19" xmlns="http://www.w3.org/2000/svg"><title>OpenAI</title><path d="M21.55 10.004a5.416 5.416 0 00-.478-4.501c-1.217-2.09-3.662-3.166-6.05-2.66A5.59 5.59 0 0010.831 1C8.39.995 6.224 2.546 5.473 4.838A5.553 5.553 0 001.76 7.496a5.487 5.487 0 00.691 6.5 5.416 5.416 0 00.477 4.502c1.217 2.09 3.662 3.165 6.05 2.66A5.586 5.586 0 0013.168 23c2.443.006 4.61-1.546 5.361-3.84a5.553 5.553 0 003.715-2.66 5.488 5.488 0 00-.693-6.497v.001zm-8.381 11.558a4.199 4.199 0 01-2.675-.954c.034-.018.093-.05.132-.074l4.44-2.53a.71.71 0 00.364-.623v-6.176l1.877 1.069c.02.01.033.029.036.05v5.115c-.003 2.274-1.87 4.118-4.174 4.123zM4.192 17.78a4.059 4.059 0 01-.498-2.763c.032.02.09.055.131.078l4.44 2.53c.225.13.504.13.73 0l5.42-3.088v2.138a.068.068 0 01-.027.057L9.9 19.288c-1.999 1.136-4.552.46-5.707-1.51h-.001zM3.023 8.216A4.15 4.15 0 015.198 6.41l-.002.151v5.06a.711.711 0 00.364.624l5.42 3.087-1.876 1.07a.067.067 0 01-.063.005l-4.489-2.559c-1.995-1.14-2.679-3.658-1.53-5.63h.001zm15.417 3.54l-5.42-3.088L14.896 7.6a.067.067 0 01.063-.006l4.489 2.557c1.998 1.14 2.683 3.662 1.529 5.633a4.163 4.163 0 01-2.174 1.807V12.38a.71.71 0 00-.363-.623zm1.867-2.773a6.04 6.04 0 00-.132-.078l-4.44-2.53a.731.731 0 00-.729 0l-5.42 3.088V7.325a.068.068 0 01.027-.057L14.1 4.713c2-1.137 4.555-.46 5.707 1.513.487.833.664 1.809.499 2.757h.001zm-11.741 3.81l-1.877-1.068a.065.065 0 01-.036-.051V6.559c.001-2.277 1.873-4.122 4.181-4.12.976 0 1.92.338 2.671.954-.034.018-.092.05-.131.073l-4.44 2.53a.71.71 0 00-.365.623l-.003 6.173v.002zm1.02-2.168L12 9.25l2.414 1.375v2.75L12 14.75l-2.415-1.375v-2.75z"></path></svg><span class="tip">Codex(桌面版/CLI)</span>
      </button>
      <button class="nav-btn agent" style="--ac:var(--c-claude)" data-a="agent" data-g="claude" title="Claude Code">
        <svg height="19" viewBox="0 0 24 24" width="19" xmlns="http://www.w3.org/2000/svg"><title>Claude</title><path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z" fill="#D97757" fill-rule="nonzero"></path></svg><span class="tip">Claude Code(注入式托管)</span>
      </button>
      <button class="nav-btn agent" style="--ac:var(--c-direct)" data-a="agent" data-g="hermes" title="Hermes">
        <svg viewBox="0 0 16 16" width="19" height="19" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 1.5v13" stroke-width="1.5" stroke-linecap="round"/><path d="M8 3.25c-2.35-1.4-4.7-.95-6.25.35 1.85-.2 3.8.2 5.55 1.55" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 3.25c2.35-1.4 4.7-.95 6.25.35-1.85-.2-3.8.2-5.55 1.55" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13.25c-2.3-1-3.05-2.65-1.35-4.15-2 .8-2.35 2.95-.35 4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13.25c2.3-1 3.05-2.65 1.35-4.15 2 .8 2.35 2.95.35 4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="1.8" r="1.1" fill="currentColor" stroke="none"/></svg><span class="tip">Hermes(叠加托管)</span>
      </button>
      <!-- 未实现的 agent 平台由 app.js 从 /api/desktop/agents 注册表动态注入「即将上线」占位(A 阶段,D3) -->
      <div class="nav-sep"></div>
      <div class="nav-foot">
        <button class="nav-btn" id="nv-history" style="--ac:var(--c-gw)" data-a="view" data-v="history"><span>🕘</span><span class="tip">历史会话</span></button>
        <button class="nav-btn" id="nv-settings" style="--ac:var(--c-gw)" data-a="settings-open"><span>⚙</span><span class="tip">设置(IP 管理 · 账号 · 通用…)</span></button>
      </div>
    </nav>

    <!-- ② 供应商栏(仅 Codex 的 dash 视图显示;history / Claude 收中栏) -->
    <div class="rail">
      <div class="rail-scroll no-bar" id="railList"></div>
    </div>

    <!-- ③ 主区 -->
    <main class="content no-bar" id="content"></main>
  </div>
</div>

<!-- 编辑供应商弹窗 -->
<div class="mask" id="editMask" style="display:none">
  <div class="box">
    <h3 id="editTitle">编辑供应商</h3>
    <div class="box-body no-bar">
      <div class="grid2">
        <div class="f" style="grid-column:1/-1"><label>名称 *</label><input id="eName"></div>
        <div class="f" style="grid-column:1/-1"><label>上游地址 *</label><input class="mono" id="eUrl"></div>
        <div class="f" style="grid-column:1/-1"><label>api key · 留空不修改</label><input type="password" class="mono" id="eKey" placeholder="sk-..."></div>
        <div class="f"><label>默认模型 *</label><input class="mono" id="eModel" placeholder="点「拉取模型」后自动填入"></div>
        <div class="f"><label>协议</label><select id="eWire">
          <option value="auto">自动(探测上游)</option>
          <option value="responses">Responses</option>
          <option value="chat_completions">ChatCompletions</option>
          <option value="anthropic">Messages(Anthropic)</option>
        </select></div>
      </div>
      <table class="mtable"><thead><tr><th>模型名</th><th>上下文</th><th></th></tr></thead><tbody id="modelRows"></tbody></table>
      <div class="btn-row" style="margin-top:8px"><button class="btn ghost" data-a="mfetch">⤓ 拉取模型</button><button class="btn ghost" data-a="mrow-add">＋ 手动加一行</button></div>
      <details style="margin-top:8px"><summary class="eyebrow" style="cursor:pointer">高级(代理 · 超时 · 备注)· 不用动</summary><div class="sub" style="margin-top:6px">协议默认自动(拉取模型时探测回写);上游兼容 Responses / ChatCompletions 时网关自动转换;Messages 供 Claude 供应商使用。</div></details>
    </div>
    <div class="btn-row" style="margin-top:10px"><button class="btn primary" data-a="edit-save">保存</button><button class="btn ghost" data-a="close-edit">取消</button></div>
  </div>
</div>

<!-- ⚙ 设置弹窗:统一管理中心(五分区) -->
<div class="mask" id="setMask" style="display:none" data-a="settings-close">
  <div class="box" style="width:680px;max-height:80vh;display:grid;grid-template-columns:132px minmax(0,1fr);padding:0;overflow:hidden">
    <aside id="setTabs" style="border-right:1px solid var(--hair);padding:12px 6px;display:flex;flex-direction:column;gap:2px"></aside>
    <div class="box-body no-bar" id="setBody" style="padding:14px 16px"></div>
  </div>
</div>

<!-- 一键导入 Key 向导(登录后自动弹 / 头像菜单进入) -->
<div class="mask" id="impMask" style="display:none" data-a="imp-close">
  <div class="box" style="width:460px">
    <h3 style="margin:0 0 4px">⇭ 一键导入 Key</h3>
    <div class="sub">勾选要导入的 Key,自动拉取模型、生成供应商,无需手动填写。</div>
    <div class="box-body no-bar" id="impBody"></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn primary" data-a="imp-do">导入选中</button><button class="btn ghost" data-a="imp-close">取消</button></div>
  </div>
</div>

<!-- 登录 2xapi 账号(邮箱/密码 + 记住我;站点开启验证码时弹出滑块) -->
<div class="mask" id="loginMask" style="display:none" data-a="login-close">
  <div class="box" style="width:360px">
    <h3 style="margin:0 0 4px">登录 2xapi 账号</h3>
    <div class="sub">登录后可一键导入你的 Key,自动生成供应商。</div>
    <div id="loginForm"></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn primary" data-a="do-login">登录</button><button class="btn ghost" data-a="login-close">取消</button></div>
  </div>
</div>

<div id="toastRoot"></div>
<div class="confirm-mask" id="confirmMask" style="display:none">
  <div class="confirm-box">
    <div class="confirm-title" id="cfTitle"></div>
    <div class="confirm-msg" id="cfMsg"></div>
    <div class="btn-row" style="margin:0">
      <button class="btn danger" id="cfYes" data-a="confirm-yes">确认</button>
      <button class="btn ghost" data-a="confirm-no">取消</button>
    </div>
  </div>
</div>

<script src="./api-client.js"></script>
<script src="./app.js"></script>
</body>
</html>
