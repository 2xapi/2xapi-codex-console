name: 全平台打包

on:
  workflow_dispatch: {}   # 手动触发(Actions 页 → Run workflow)
  push:
    tags: ['v*']          # 打 tag 自动打包

permissions:
  contents: write   # Release 发布需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            target: ''                      # 默认 MSVC x64
            artifact: windows-installer
            release_files: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos-applesilicon
            target: ''                      # 默认 aarch64
            artifact: macos-applesilicon
            release_files: |
              src-tauri/target/release/bundle/dmg/*.dmg
            paths: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-latest
            name: macos-intel
            target: x86_64-apple-darwin      # 交叉编译 Intel
            artifact: macos-intel
            release_files: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            paths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: 安装 tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: 打包(前端纯静态,无需 Node 构建)
        run: cargo tauri build ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
        working-directory: src-tauri

      - name: dmg 改名(tauri 原生 arm64 构建也产 _x64 名,防与 Intel 产物同名互相覆盖)
        if: runner.os == 'macOS' && matrix.target == ''
        run: |
          cd src-tauri/target/release/bundle/dmg
          for f in *.dmg; do [ -e "$f" ] || continue; mv "$f" "${f%.dmg}_aarch64.dmg"; done

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      - name: 发布到 GitHub Release(tag 触发时;附件可匿名下载)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_files }}
